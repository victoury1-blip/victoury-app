name: CI

on:
  push:
    branches: [main]
  pull_request:

# Plusieurs poussées rapprochées empilaient autant d'exécutions dans la file ;
# faute de runner disponible, certaines finissaient annulées après ~15 min.
# Seule la dernière exécution par branche est conservée.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
