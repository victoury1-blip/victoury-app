<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Repli PNG : certains navigateurs (ou une capture d'écran de l'onglet)
         n'affichent pas toujours le favicon SVG. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- Permet d'installer l'administration (/store) comme une icône sur
         l'écran d'accueil du téléphone, à la manière de l'appli mobile
         WooCommerce — le scope du manifeste limite l'installation à /store,
         la boutique publique n'en propose jamais l'invite. -->
    <link rel="manifest" href="/manifest-admin.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Se rapproche du noir de la barre d'annonce/du pied de page : sur
         Android Chrome, cette couleur teinte la barre d'adresse une fois la
         page en haut de l'écran — un bleu marine tranchait avec le noir
         juste en dessous, créant une ligne visible entre les deux. -->
    <meta name="theme-color" content="#000000" />
    <!-- Photos (produits, hero) et réglages (thème, prix) viennent tous du
         même projet Supabase. Ouvrir la connexion HTTPS ici, avant même le
         chargement du bundle JS, gagne l'aller-retour DNS+TLS complet sur la
         toute première requête (réglages) — le faire depuis un useEffect
         React arrivait après coup, une fois le bundle déjà téléchargé et
         exécuté. %VITE_SUPABASE_URL% est substitué par Vite au build à
         partir de la variable d'environnement du même nom (non secrète :
         déjà présente en clair dans le bundle JS livré au navigateur). -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <!-- Préchargement (PageSpeed : « Détection de la requête LCP ») : sur une
         page collection ou produit — celles où arrivent les pubs — la liste
         des produits partait seulement APRÈS le téléchargement et
         l'exécution de tout le JavaScript, et les photos encore après. Ici,
         la requête part dès la lecture du HTML, en parallèle du JavaScript,
         et les premières photos sont demandées dès que la liste arrive.
         catalog.js reprend cette réponse au lieu de refaire la requête
         (même sélection de colonnes, voir PRODUIT dans catalog.js). Clé
         publique (anon), déjà présente en clair dans le bundle JS. -->
    <script>
      (function () {
        try {
          var U = '%VITE_SUPABASE_URL%', K = '%VITE_SUPABASE_ANON_KEY%';
          if (U.indexOf('http') !== 0 || !window.fetch) return;
          var H = { apikey: K, Authorization: 'Bearer ' + K };
          var P = 'id,slug,name,description,details,price,compare_at,gender,status,unlisted,color_name,color_hex,position,group_id,collection_id,is_bestseller,video_url,created_at,images:shop_product_images(url,alt,position),sizes:shop_product_sizes(size,stock,position)';
          var chemin = location.pathname, m;
          function premiere(x) {
            var im = (x.images || []).slice().sort(function (a, b) { return a.position - b.position; })[0];
            return im && im.url;
          }
          function vignette(u) {
            return u && u.indexOf('/storage/v1/object/public/boutique/') >= 0 ? u.replace(/\.[^./]+$/, '-thumb.webp') : u;
          }
          function precharger(u) {
            if (!u) return;
            var l = document.createElement('link');
            l.rel = 'preload'; l.as = 'image'; l.href = u; l.setAttribute('fetchpriority', 'high');
            document.head.appendChild(l);
          }
          function lire(q) {
            return fetch(U + '/rest/v1/shop_products?' + q, { headers: H })
              .then(function (r) { if (!r.ok) throw new Error('precharge'); return r.json(); });
          }
          if ((m = chemin.match(/^\/product-category\/([^/]+)\/?$/))) {
            var slug = decodeURIComponent(m[1]);
            var pr = lire('select=' + encodeURIComponent(P + ',collection:shop_collections!inner(id,slug,name,description)')
              + '&collection.slug=eq.' + encodeURIComponent(slug) + '&status=eq.Actif&unlisted=eq.false&order=position');
            window.__precharge = { type: 'collection', slug: slug, promise: pr };
            // Les 2 premières cartes : le premier écran d'un téléphone (une carte par modèle).
            pr.then(function (d) {
              var vus = {}, n = 0;
              for (var i = 0; i < d.length && n < 2; i++) {
                var x = d[i];
                if (x.group_id) { if (vus[x.group_id]) continue; vus[x.group_id] = 1; }
                var u = premiere(x);
                if (u) { precharger(vignette(u)); n++; }
              }
            }).catch(function () {});
          } else if ((m = chemin.match(/^\/product\/([^/]+)\/?$/))) {
            var slugP = decodeURIComponent(m[1]);
            var pp = lire('select=' + encodeURIComponent(P) + '&slug=eq.' + encodeURIComponent(slugP) + '&status=eq.Actif');
            window.__precharge = { type: 'produit', slug: slugP, promise: pp };
            // Grande photo de la fiche (pas de vignette) — sauf si une vidéo passe en premier.
            pp.then(function (d) { if (d[0] && !d[0].video_url) precharger(premiere(d[0])); }).catch(function () {});
          }
        } catch (e) { /* jamais bloquant : catalog.js refait la requête */ }
      })();
    </script>
    <!-- Cairo (Google Fonts) pour le bandeau d'annonce en arabe : Jost ne
         couvre pas les glyphes arabes, le texte y retombait sur la police
         système par défaut, moins soignée que le reste du site. Chargée à la
         demande (pas préchargée comme Jost) : ne s'affiche que sur la
         version arabe du site, pas sur toutes les visites. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non bloquante : une feuille de style Google Fonts classique retardait
         l'affichage de TOUTE la page (PageSpeed : « Requêtes de blocage du
         rendu ») pour une police qui ne sert qu'au bandeau en arabe. Chargée
         en « print » puis basculée sur « all » une fois arrivée. -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet" /></noscript>
    <!-- Jost est maintenant hébergée sur ce site (public/fonts, voir
         index.css) plutôt que chez Google Fonts : plus de connexion à un
         domaine tiers à établir avant de pouvoir l'afficher. Les 4 poids
         utilisés par le site (300/400/500/600) sont préchargés — PageSpeed a
         fini par montrer que précharger seulement le 400 ne suffisait pas :
         le titre du pied de page (font-medium, poids 500) et d'autres textes
         en gras (font-semibold, poids 600) arrivaient quand même en retard
         et provoquaient le même décalage de mise en page une fois arrivés.
         Chaque fichier ne pèse qu'environ 10 Kio (40 Kio les 4) — largement
         moins coûteux que le décalage qu'ils évitent. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jost-latin-300-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jost-latin-400-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jost-latin-500-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jost-latin-600-normal.woff2" crossorigin />
    <!-- Logo affiché dans le contenu de secours ci-dessous (#root, avant que
         React ne prenne le relais) : préchargé en parallèle du bundle JS pour
         qu'il soit déjà là au moment où le HTML l'affiche, au lieu d'un
         second aller-retour réseau qui le ferait apparaître avec un temps de
         retard visible. -->
    <link rel="preload" as="image" href="/loading-logo.png" />
    <!-- Court exprès : un titre long ("VICTOURY — Ensembles sport...") se
         voit tronqué dans un onglet étroit et affiche alors l'URL à la
         place, ce que le client lit comme "le site ne s'appelle pas
         Victoury". -->
    <title>VICTOURY</title>
    <meta name="description" content="Ensembles sport, burkinis et robes. Livraison partout au Maroc, paiement à la livraison." />
  </head>
  <body>
    <!-- Contenu statique, sans JavaScript : servi immédiatement par le HTML
         lui-même, avant même que le bundle React n'ait fini de se
         télécharger/exécuter. Sur une connexion lente (le pire cas : un clic
         sur une pub ouvert dans le navigateur intégré d'Instagram/TikTok),
         un visiteur ne voyait rien du tout — écran blanc — pendant plusieurs
         secondes, ce qui donnait l'impression que la page ne chargeait pas.
         Le nom de la marque s'affiche à la place, dans le même style que
         Wordmark.jsx (voir src/components/Wordmark.jsx et .wordmark dans
         index.css) : React le remplace dès qu'il prend le relais, sans
         décalage visuel puisque c'est le même texte, à la même place. -->
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;">
        <img src="/loading-logo.png" alt="Victoury" width="180" height="75" style="width:180px;height:auto;" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
