<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Repli PNG : certains navigateurs (ou une capture d'écran de l'onglet)
         n'affichent pas toujours le favicon SVG. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- Permet d'installer l'administration (/store) comme une icône sur
         l'écran d'accueil du téléphone, à la manière de l'appli mobile
         WooCommerce — le scope du manifeste limite l'installation à /store,
         la boutique publique n'en propose jamais l'invite. -->
    <link rel="manifest" href="/manifest-admin.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1424" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Chargée en non-bloquant : un <link rel="stylesheet"> classique retarde
         le premier rendu de toute la page le temps d'aller chercher cette
         feuille chez Google Fonts. Le texte s'affiche tout de suite dans la
         police de repli, puis bascule sur Jost dès qu'elle arrive (bascule
         couverte par le "swap" déjà demandé dans l'URL). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" /></noscript>
    <!-- Court exprès : un titre long ("VICTOURY — Ensembles sport...") se
         voit tronqué dans un onglet étroit et affiche alors l'URL à la
         place, ce que le client lit comme "le site ne s'appelle pas
         Victoury". -->
    <title>VICTOURY</title>
    <meta name="description" content="Ensembles sport, burkinis et robes. Livraison partout au Maroc, paiement à la livraison." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
